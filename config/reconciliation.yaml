# Reconciliation engine configuration for Stage 10
# (s10_event_area_transfer_matrix.py)
#
# Every threshold and weight here has a rationale comment.
# Change these values rather than hard-coding in scripts.

# ---------------------------------------------------------------------------
# Residual accounting
# ---------------------------------------------------------------------------

# A residual below this percentage of source district area is classified
# IGNORABLE_RESIDUAL. It is NEVER deleted from the audit table — it is
# recorded with this classification. This implements the "1% tolerance rule"
# from the architecture spec (§8 of event accounting requirements).
residual_tolerance_pct: 1.0

# ---------------------------------------------------------------------------
# Recovery hierarchy weights (Level 2 adjacency scoring)
# Scores are combined as:
#   Score_j = w1*adjacent + w2*parent_relation + w3*shared_boundary
#              + w4*area_consistency + w5*event_relation
# Weights must sum to 1.0.
# ---------------------------------------------------------------------------
recovery_weights:
  # Whether j shares a boundary with the residual polygon
  adjacency: 0.25
  # Whether j is a known parent or child of the event's predecessor/successor
  parent_relation: 0.30
  # Length of shared boundary between residual and j, normalized
  shared_boundary: 0.20
  # Whether j's area gain is consistent with the residual size
  area_consistency: 0.15
  # Whether j appears in the event_summary for this event
  event_relation: 0.10

# A candidate district's combined score must clear this threshold to be
# assigned RECOVERED_BY_ADJACENCY. Below this: UNRESOLVED_RESIDUAL.
# Rationale: 0.65 requires substantial multi-criterion evidence, not just
# spatial proximity. Lowering risks fabricating attribution from adjacency
# alone; raising may leave valid recoveries unclassified.
confidence_threshold: 0.65

# ---------------------------------------------------------------------------
# Geometry / sliver parameters (re-use lib.py values as defaults;
# override here if event-level accounting needs different thresholds)
# ---------------------------------------------------------------------------

# Minimum parcel area to be considered a real transfer (not digitization noise)
sliver_abs_km2: 0.5

# Area method agreement tolerance: stored area vs recomputed geodesic area.
# Two calculations of the same polygon should agree to ~1e-4%; 0.05% is a
# smoke test for method drift (see redesign doc §2.8), not uncertainty slack.
area_method_tolerance_pct: 0.05

# ---------------------------------------------------------------------------
# Spatial reconstruction for GPKG residual geometries
# ---------------------------------------------------------------------------

# Strategy for producing residual polygon geometry for event_residuals.gpkg.
# "difference": reconstruct by (source_polygon - accounted_union) using
#   silver GeoParquets. Accurate but requires loading geometries per event.
# "centroid_only": write centroid point instead of polygon (faster, less
#   accurate visually in QGIS). Recommended for large runs.
residual_geometry_strategy: "difference"

# ---------------------------------------------------------------------------
# Event narrative output
# ---------------------------------------------------------------------------

# Whether to emit the machine-readable event_narratives.json (always True
# in production; can disable for fast testing runs)
emit_json_narratives: true

# Whether to emit the human-readable event_narratives.md
emit_md_narratives: true

# ---------------------------------------------------------------------------
# Stage 10b — Spatial Successor Discovery configuration
# (s10b_spatial_successor_discovery.py)
# ---------------------------------------------------------------------------

# Enable cross-state CK lookup (Level 2 recovery). Set to false only for
# testing or if you want to measure state-constrained-only resolution.
enable_cross_state_resolution: true

# Minimum intersection area (km²) for a candidate to enter the candidate
# table. Filters digitization noise / slivers.
min_discovery_intersection_km2: 1.0

# Minimum intersection fraction of predecessor area (%) for a candidate.
# A 0.5% overlap means the district touches meaningfully.
min_candidate_overlap_pct: 0.5

# Candidate ranking weights (spec §40 / §19).
# Keys must match the weight lookups in s10b_spatial_successor_discovery.py.
# Weights should sum to 1.0.
# DO NOT treat administrative evidence (declared_in_event, parent_child_relation)
# as just another weighted score — the Python code gates on these separately.
candidate_ranking_weights:
  intersection_area_km2: 0.25        # normalised to max overlap in the event
  intersection_pct_of_pre: 0.20      # fraction of predecessor covered
  intersection_pct_of_candidate: 0.15 # does candidate "fit" inside predecessor?
  shared_boundary: 0.10              # shared boundary length, normalised
  spatial_adjacency: 0.05            # touches predecessor (binary)
  event_year_compat: 0.05            # candidate active at post_vintage
  parent_child_relation: 0.10        # known parent/child in district_relationship
  state_transition_compat: 0.05      # historically plausible state transition
  name_similarity: 0.03              # Jaro-Winkler vs declared successor names
  declared_in_event: 0.02            # explicitly listed in event_summary

# Minimum score for a candidate to receive SPATIALLY_CONFIRMED_BUT_EVENT_UNLISTED
spatial_confirm_threshold: 0.55

# Minimum score for a candidate to be recovered at L3/L4
spatial_recovery_threshold: 0.65

# Events whose year is within this many years of the most recent geometry
# vintage (2025) but whose declared successors cannot be found spatially
# are classified VINTAGE_MISMATCH rather than UNRESOLVED. This covers
# 2022–2023 mega-splits where the event exists but the geometry may not
# have been updated to reflect the exact new district extents.
recent_event_vintage_gap_years: 4

# Whether to write the persistent name alias registry back to gold layer.
# Option A: true  → data/gold/core/name_alias_registry.parquet
# Option B: false → aliases used in-run only
persist_name_aliases: true

# Minimum name similarity score (0-1, Jaro-Winkler) for an alias candidate
# to be considered. An alias requires name evidence; proximity alone is never
# sufficient.
alias_name_similarity_threshold: 0.75

